# ============================================
# GitLab CI/CD Pipeline
# ============================================
#
# 파이프라인: build → test → docker → deploy
#
# 브랜치 전략:
#   develop     → dev 환경 배포 (수동)
#   release/*   → stg 환경 배포 (수동)
#   main/master → prod 환경 배포 (수동)
#   MR          → build + test만 실행
#
# 필수 CI/CD Variables (Settings → CI/CD → Variables):
#   SSH_PRIVATE_KEY       - 배포 서버 SSH 개인키
#   DEV_SERVER_HOST       - 개발 서버 호스트
#   DEV_SERVER_USER       - 개발 서버 SSH 계정
#   DEV_DEPLOY_PATH       - 개발 서버 배포 경로
#   STG_SERVER_HOST/USER/DEPLOY_PATH - 스테이징 서버
#   PROD_SERVER_HOST/USER/DEPLOY_PATH - 운영 서버
#
# 선택 CI/CD Variables:
#   SONAR_HOST_URL        - SonarQube 서버 URL
#   SONAR_TOKEN           - SonarQube 인증 토큰
#   NEXUS_USERNAME        - Nexus 저장소 계정
#   NEXUS_PASSWORD        - Nexus 저장소 비밀번호
# ============================================

stages:
  - build
  - test
  - docker
  - deploy-dev
  - deploy-stg
  - deploy-prod

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  API_IMAGE: "${CI_REGISTRY_IMAGE}/api"
  BATCH_IMAGE: "${CI_REGISTRY_IMAGE}/batch"

# MR 중복 파이프라인 방지
# MR이 열린 브랜치는 MR 파이프라인만 실행하고, 브랜치 파이프라인은 실행하지 않음
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Gradle 캐시 (브랜치별)
cache: &gradle-cache
  key: "${CI_COMMIT_REF_SLUG}-gradle"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

# ============================================
# Build Stage
# ============================================
build:
  stage: build
  image: gradle:8.13-jdk21
  script:
    - chmod +x gradlew
    - ./gradlew clean :module-api:bootJar :module-batch:bootJar
        -x test -x spotlessCheck -x checkstyleMain -x checkstyleTest
        -x pmdMain -x pmdTest -x spotbugsMain
        -Pprofile=prod --no-daemon
  artifacts:
    paths:
      - module-api/build/libs/module-api-*.jar
      - module-batch/build/libs/module-batch-*.jar
      - module-api/build/classes/
      - module-batch/build/classes/
      - module-common/build/classes/
    exclude:
      - "**/*-plain.jar"
    expire_in: 1 hour

# ============================================
# Test Stage
# ============================================
test:
  stage: test
  image: gradle:8.13-jdk21
  cache:
    <<: *gradle-cache
    policy: pull
  script:
    - chmod +x gradlew
    - ./gradlew check jacocoTestReport --no-daemon
  artifacts:
    when: always
    reports:
      junit:
        - "**/build/test-results/test/TEST-*.xml"
    paths:
      - "**/build/reports/jacoco/"
      - "**/build/reports/checkstyle/"
      - "**/build/reports/pmd/"
      - "**/build/reports/spotbugs/"
    expire_in: 7 days

# SonarQube 분석 (선택 - SONAR_HOST_URL 설정 시만 실행)
# sonar-scanner-cli를 사용하므로 Gradle에 SonarQube 플러그인 없이 동작한다.
# build Job의 artifacts(컴파일된 클래스)에 의존하여 분석한다.
sonarqube:
  stage: test
  image: sonarsource/sonar-scanner-cli:latest
  dependencies:
    - build
  allow_failure: true
  script:
    - >
      sonar-scanner
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.login=${SONAR_TOKEN}
      -Dsonar.projectKey=${SONAR_PROJECT_KEY:-${CI_PROJECT_PATH_SLUG}}
      -Dsonar.projectName=${SONAR_PROJECT_NAME:-${CI_PROJECT_NAME}}
      -Dsonar.sources=module-api/src/main/java,module-batch/src/main/java,module-common/src/main/java
      -Dsonar.java.binaries=module-api/build/classes,module-batch/build/classes,module-common/build/classes
      -Dsonar.sourceEncoding=UTF-8
  rules:
    - if: $SONAR_HOST_URL && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $SONAR_HOST_URL && $CI_COMMIT_BRANCH == "develop"

# ============================================
# Docker Stage
# ============================================
.docker-build:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

docker:api:
  extends: .docker-build
  script:
    - docker build -f module-api/Dockerfile
        -t ${API_IMAGE}:${CI_COMMIT_SHORT_SHA}
        -t ${API_IMAGE}:${CI_COMMIT_REF_SLUG}
        .
    - docker push ${API_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${API_IMAGE}:${CI_COMMIT_REF_SLUG}

docker:batch:
  extends: .docker-build
  script:
    - docker build -f module-batch/Dockerfile
        -t ${BATCH_IMAGE}:${CI_COMMIT_SHORT_SHA}
        -t ${BATCH_IMAGE}:${CI_COMMIT_REF_SLUG}
        .
    - docker push ${BATCH_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${BATCH_IMAGE}:${CI_COMMIT_REF_SLUG}

# ============================================
# Deploy Stage - Docker 기반 배포
# ============================================
# SSH Key 기반 인증으로 대상 서버에 접속하여 Docker Compose로 배포한다.
# 대상 서버에 docker-compose.prod.yml과 .env 파일이 준비되어 있어야 한다.
.deploy-docker:
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} << ENDSSH
        set -e

        cd ${DEPLOY_PATH}

        # 레지스트리 로그인
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}

        # 이미지 Pull
        docker pull ${API_IMAGE}:${IMAGE_TAG}
        docker pull ${BATCH_IMAGE}:${IMAGE_TAG}

        # docker-compose.prod.yml 에서 사용할 이미지 태그 설정
        export API_IMAGE=${API_IMAGE}
        export BATCH_IMAGE=${BATCH_IMAGE}
        export IMAGE_TAG=${IMAGE_TAG}

        # 배포
        docker compose -f docker-compose.prod.yml up -d --force-recreate

        # 미사용 이미지 정리
        docker image prune -f

        echo "배포 완료: API=${API_IMAGE}:${IMAGE_TAG}, Batch=${BATCH_IMAGE}:${IMAGE_TAG}"
      ENDSSH

deploy:dev:
  extends: .deploy-docker
  stage: deploy-dev
  when: manual
  environment:
    name: development
    url: https://dev-api.example.com
  variables:
    DEPLOY_HOST: ${DEV_SERVER_HOST}
    DEPLOY_USER: ${DEV_SERVER_USER}
    DEPLOY_PATH: ${DEV_DEPLOY_PATH}
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual

deploy:stg:
  extends: .deploy-docker
  stage: deploy-stg
  when: manual
  environment:
    name: staging
    url: https://stg-api.example.com
  variables:
    DEPLOY_HOST: ${STG_SERVER_HOST}
    DEPLOY_USER: ${STG_SERVER_USER}
    DEPLOY_PATH: ${STG_DEPLOY_PATH}
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
      when: manual

deploy:prod:
  extends: .deploy-docker
  stage: deploy-prod
  when: manual
  environment:
    name: production
    url: https://api.example.com
  variables:
    DEPLOY_HOST: ${PROD_SERVER_HOST}
    DEPLOY_USER: ${PROD_SERVER_USER}
    DEPLOY_PATH: ${PROD_DEPLOY_PATH}
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual

