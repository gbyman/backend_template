input {
  # TCP 입력 (Logback에서 직접 전송)
  tcp {
    port => 5000
    codec => json_lines
    type => "logstash-tcp"
  }

  # 파일 입력 (Filebeat 없이 직접 읽기)
  file {
    path => "/logs/application-json.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    type => "json-file"
  }

  # Beats 입력 (Filebeat에서 수집)
  beats {
    port => 5044
    type => "filebeat"
  }
}

filter {
  # timestamp 파싱
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
    target => "@timestamp"
  }

  # 로그 레벨 정규화
  mutate {
    uppercase => [ "level" ]
  }

  # 에러 로그에 태그 추가
  if [level] == "ERROR" {
    mutate {
      add_tag => [ "error" ]
    }
  }

  # 스택트레이스 멀티라인 처리
  if [stack_trace] {
    mutate {
      add_field => { "has_exception" => true }
    }
  }

  # 애플리케이션 이름 추가
  if ![app] {
    mutate {
      add_field => { "app" => "backend-template" }
    }
  }

  # 환경 정보 추가
  if ![env] {
    mutate {
      add_field => { "env" => "unknown" }
    }
  }
}

output {
  # Elasticsearch 출력
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "backend-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # 디버그용 콘솔 출력 (개발 시에만)
  # stdout {
  #   codec => rubydebug
  # }
}
