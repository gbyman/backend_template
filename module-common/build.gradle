plugins {
	id 'java-library'
}

jar {
	enabled = true
}

bootJar {
	enabled = false
}

dependencies {
	api 'org.springframework.boot:spring-boot-starter-web'
	api 'org.springframework.boot:spring-boot-starter-validation'
	api 'org.springframework.data:spring-data-commons'
	api 'org.springframework.boot:spring-boot-starter-webflux'
	api 'org.springframework.boot:spring-boot-starter-security'

	// JPA & Database
	api 'org.springframework.boot:spring-boot-starter-data-jpa'
	api 'org.springframework.boot:spring-boot-starter-data-redis'
	api 'org.postgresql:postgresql'

	// QueryDSL (BOM에서 버전 관리)
	api "com.querydsl:querydsl-jpa:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
	annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// AOP
	api 'org.springframework.boot:spring-boot-starter-aop'

	// P6Spy (SQL Logging)
	api "com.github.gavlyukovskiy:p6spy-spring-boot-starter:${p6spyVersion}"

	// MapStruct (api만 제공, annotationProcessor는 module-api에서만 사용)
	api "org.mapstruct:mapstruct:${mapstructVersion}"

	// swagger
	api "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// apache commons
	api 'org.apache.commons:commons-lang3:3.14.0'
	api "commons-validator:commons-validator:${commonsValidatorVersion}"

	// HTML sanitization
	api "org.jsoup:jsoup:${jsoupVersion}"

	// Apache POI - Excel 읽기/쓰기
	api "org.apache.poi:poi-ooxml:${poiVersion}"

	// Jasypt - 설정 파일 암호화
	api "com.github.ulisesbocchio:jasypt-spring-boot-starter:${jasyptVersion}"

	// Logstash Encoder - JSON 로그 포맷 (ELK Stack 사용 시)
	api "net.logstash.logback:logstash-logback-encoder:${logstashVersion}"

	// Elasticsearch Appender - Elasticsearch로 직접 전송 (선택적)
	api "com.internetitem:logback-elasticsearch-appender:${logbackElasticsearchVersion}"
}
