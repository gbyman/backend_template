# Quartz Job 스케줄 설정
# registered: true인 Job만 Quartz에 등록됨

spring:
  quartz:
    jobs:
      # 메일 발송 이력 정리 (90일 초과 이력 삭제)
      - name: mailHistoryCleanupJob
        description: "메일 발송 이력 정리"
        cron: "0 0 2 * * ?"  # 매일 새벽 2시
        registered: false  # 운영 환경에서 true로 변경
        params:
          retentionDays: 90
